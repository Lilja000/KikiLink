name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            cloud/package-lock.json
      - run: npm ci
      - run: npm --prefix worker ci
      - run: npm --prefix cloud ci
      - run: npm audit --audit-level=high
      - run: npm --prefix worker audit --audit-level=high
      - run: npm --prefix cloud audit --audit-level=high
      - run: npm run check
      - run: npm --prefix worker run check
      - run: npm --prefix cloud run check
      - name: Verify committed release artifacts
        run: git diff --exit-code -- dist/KikiLink.user.js dist/KikiLink.fusam.js
