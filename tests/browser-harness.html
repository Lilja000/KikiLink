<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KikiLink browser harness</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: radial-gradient(circle at 30% 20%, #31202a, #111116 46%, #08080b);
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #MainCanvas { width: min(100vw, 1200px); height: auto; display: block; margin: 40px auto 0; background: #19131a; }
      #harness-status { position: fixed; top: 8px; left: 8px; z-index: 20; font: 13px/1.4 monospace; }
      #activity-grid { position: fixed; right: 12px; bottom: 24px; display: grid; gap: 6px; z-index: 20; }
      #activity-grid button { min-width: 180px; min-height: 42px; position: relative; }
    </style>
  </head>
  <body>
    <div id="harness-status">Starting real-bundle integration check…</div>
    <canvas id="MainCanvas" width="2000" height="1000"></canvas>
    <div id="activity-grid"></div>
    <script>
      window.alert = () => {};
      window.Player = {
        MemberNumber: 999001,
        Name: "KikiAccount",
        Nickname: "Kiki",
        ExtensionSettings: {},
        FriendNames: new Map([
          [123456, "ReinaAccount"],
          [456789, "SidneyAccount"],
        ]),
      };
      window.ChatRoomCharacter = [
        window.Player,
        { MemberNumber: 123456, Name: "ReinaAccount", Nickname: "Reina" },
      ];
      window.ChatRoomCharacterDrawlist = window.ChatRoomCharacter;
      window.ChatRoomCharacterViewLoopCharacters = (callback) => {
        if (callback(0, 100, 0, 500, 1)) return;
        callback(1, 600, 0, 500, 1);
      };
      window.ChatRoomCharacterViewDrawOverlay = (character, x, y, zoom) =>
        window.ChatRoomDrawCharacterStatusIcons(character, x, y, zoom);
      window.ChatRoomHideIconState = 0;
      window.MainCanvas = document.getElementById("MainCanvas").getContext("2d");
      window.ChatRoomDrawCharacterStatusIcons = () => {};
      window.__KIKILINK_NATIVE_DRAWS__ = [];
      const harnessImageCache = new Map();
      window.DrawImageResize = (source, x, y, width, height) => {
        let image = harnessImageCache.get(source);
        if (!image) {
          image = new Image();
          image.src = source;
          harnessImageCache.set(source, image);
        }
        if (!image.complete || image.naturalWidth <= 0) return false;
        window.MainCanvas.drawImage(image, x, y, width, height);
        window.__KIKILINK_NATIVE_DRAWS__.push([source, x, y, width, height]);
        return true;
      };
      window.FriendListBeepLog = [
        {
          MemberNumber: 123456,
          MemberName: "ReinaAccount",
          Sent: false,
          Time: new Date(Date.now() - 120000),
          Message: "Hello from the native recent Beep list",
        },
      ];
      window.CurrentScreen = "ChatRoom";
      window.ServerPlayerIsInChatRoom = () => true;
      window.ChatRoomData = {
        Name: "KikiLink Test Room",
        Space: "MainHall",
        Visibility: ["All"],
      };
      window.ServerIsLoggedIn = () => true;
      window.ServerPlayerExtensionSettingsSync = () => {};
      window.ServerAccountBeep = () => {};
      window.ServerAccountQueryResult = () => {};
      window.ChatRoomMessage = () => {};
      window.ServerSendBeepMessage = () => {};
      window.ServerSend = (event, data) => {
        console.log("[Harness server]", event, data);
        if (event === "AccountQuery" && data?.Query === "OnlineFriends") {
          window.ServerAccountQueryResult({
            Query: "OnlineFriends",
            Result: [
              {
                Type: "Friend",
                MemberNumber: 123456,
                MemberName: "ReinaAccount",
                MemberNickname: "Reina",
                ChatRoomName: "KikiLink Test Room",
                ChatRoomSpace: "MainHall",
              },
            ],
          });
        }
      };
      window.ChatRoomSendEmote = (message) => console.log("[Harness room emote]", message);
      window.ChatRoomSetTarget = (memberNumber) => console.log("[Harness whisper]", memberNumber);
      window.InformationSheetLoadCharacter = (character) =>
        console.log("[Harness profile]", character.MemberNumber);

      window.GameVersion = "R131";
      window.AssetGroup = [
        { Name: "ItemArms", Description: "Arms", Category: "Item" },
      ];
      window.ActivityFemale3DCG = [
        { Name: "Caress", ActivityID: 1, MaxProgress: 10, Prerequisite: [], Target: ["ItemArms"], TargetSelf: ["ItemArms"] },
      ];
      window.ActivityFemale3DCGOrdering = ["Caress"];
      window.CurrentCharacter = {
        MemberNumber: 123456,
        Name: "ReinaAccount",
        Nickname: "Reina",
        FocusGroup: window.AssetGroup[0],
      };
      window.CharacterGetCurrent = () => window.CurrentCharacter;
      window.CharacterNickname = (character) => character.Nickname || character.Name;
      window.DialogMenuMode = "activities";
      window.DialogActivity = [];
      window.ActivityAllowedForGroup = (character, groupName) =>
        window.ActivityFemale3DCG
          .filter((activity) => activity.Target.includes(groupName))
          .map((activity) => ({ Activity: activity, Group: groupName }));
      window.ActivityDictionaryText = (key) => key;
      window.PreferenceGetActivityFactor = () => 2;
      window.ActivityRun = () => {};
      window.ChatRoomPublishCustomAction = () => {};
      window.ElementButton = {
        CreateForActivity(id, itemActivity, character, onClick, options, config) {
          const button = document.createElement("button");
          button.id = id || "activity";
          button.textContent = window.ActivityDictionaryText(`Activity${itemActivity.Activity.Name}`);
          button.dataset.activity = itemActivity.Activity.Name;
          if (options?.image) button.dataset.image = options.image;
          button.addEventListener("click", () => onClick?.call(button, new PointerEvent("pointerup")));
          config?.button?.parent?.append(button);
          return button;
        },
      };
      window.DialogMenuMapping = {
        activities: {
          Reload() {
            const grid = document.getElementById("activity-grid");
            grid.replaceChildren();
            window.DialogActivity.forEach((item, index) => window.ElementButton.CreateForActivity(
              `activity-${index}`,
              item,
              window.CurrentCharacter,
              () => {},
              {},
              { button: { parent: grid } },
            ));
            return Promise.resolve();
          },
        },
      };
      window.DialogBuildActivities = (character, reload = true) => {
        window.DialogActivity = window.ActivityAllowedForGroup(character, character.FocusGroup.Name);
        if (reload) void window.DialogMenuMapping.activities.Reload();
      };

      localStorage.setItem(
        "kikilink:account:999001:kikilink:settings:v1",
        JSON.stringify({
          schemaVersion: 16,
          linkActivities: {
            enabled: true,
            customActivities: [{
              id: "harness-elbow-touch",
              name: "Harness elbow touch",
              targetGroup: "ItemArms",
              targetMode: "both",
              template: "{me} touches {target's} elbow.",
              image: "Caress",
              arousal: 0,
            }],
          },
        }),
      );

      // Firefox must never need this cross-compartment escape hatch again.
      let unsafeWindowReads = 0;
      Object.defineProperty(window, "unsafeWindow", {
        configurable: true,
        get() {
          unsafeWindowReads += 1;
          throw new Error("KikiLink attempted forbidden cross-realm access");
        },
      });
    </script>
    <script src="../node_modules/bondage-club-mod-sdk/dist/bcmodsdk.js"></script>
    <script>
      const echoHarness = window.bcModSdk.registerMod({
        name: "动作拓展",
        fullName: "ECHO Activity harness",
        version: "1.0.0",
      });
      echoHarness.hookFunction("ChatRoomDrawCharacterStatusIcons", 10, (args, next) => {
        const result = next(args);
        const [, x, y, zoom] = args;
        window.MainCanvas.fillStyle = "#24a8ff";
        window.MainCanvas.fillRect(x + 420 * zoom, y + 5, 35 * zoom, 35 * zoom);
        return result;
      });
      const wceHarness = window.bcModSdk.registerMod({
        name: "WCE",
        fullName: "WCE harness",
        version: "1.0.0",
      });
      wceHarness.hookFunction("ChatRoomDrawCharacterStatusIcons", 0, (args, next) => {
        const result = next(args);
        const [, x, y, zoom] = args;
        window.MainCanvas.fillStyle = "#45d483";
        window.MainCanvas.fillRect(x + 290 * zoom, y + 5, 60 * zoom, 35 * zoom);
        return result;
      });
      const bcxHarness = window.bcModSdk.registerMod({
        name: "BCX",
        fullName: "BCX harness",
        version: "1.0.0",
      });
      bcxHarness.hookFunction("ChatRoomCharacterViewDrawOverlay", 0, (args, next) => {
        const result = next(args);
        const [, x, y, zoom] = args;
        window.MainCanvas.fillStyle = "#8b6cff";
        window.MainCanvas.fillRect(x + 375 * zoom, y + 5, 30 * zoom, 30 * zoom);
        return result;
      });
    </script>
    <script src="../dist/KikiLink.user.js"></script>
    <script>
      const runtimePageRealm = window;
      const roomRenderTimer = setInterval(() => {
        runtimePageRealm.ChatRoomCharacterViewDrawOverlay(runtimePageRealm.Player, 100, 0, 1);
      }, 50);
      setTimeout(() => runtimePageRealm.DialogBuildActivities(runtimePageRealm.CurrentCharacter, true), 700);
      setTimeout(() => {
        clearInterval(roomRenderTimer);
        const blossom = document.querySelector(".kl-room-blossom");
        const version = document.getElementById("kikilink-version");
        const custom = runtimePageRealm.DialogActivity.find((item) => item.Activity.Name.startsWith("KikiLinkCustom_"));
        const activityMark = document.querySelector("[data-kikilink-activity-mark]");
        const flowerPixels = runtimePageRealm.MainCanvas.getImageData(560, 5, 35, 35).data;
        const echoPixels = runtimePageRealm.MainCanvas.getImageData(520, 5, 35, 35).data;
        const wcePixels = runtimePageRealm.MainCanvas.getImageData(390, 5, 60, 35).data;
        const bcxPixels = runtimePageRealm.MainCanvas.getImageData(475, 5, 30, 30).data;
        let opaqueFlowerPixels = 0;
        for (let index = 3; index < flowerPixels.length; index += 4) {
          if (flowerPixels[index] > 0) opaqueFlowerPixels += 1;
        }
        let intactEchoPixels = 0;
        for (let index = 0; index < echoPixels.length; index += 4) {
          if (echoPixels[index] === 36 && echoPixels[index + 1] === 168 && echoPixels[index + 2] === 255) {
            intactEchoPixels += 1;
          }
        }
        let intactWcePixels = 0;
        for (let index = 0; index < wcePixels.length; index += 4) {
          if (wcePixels[index] === 69 && wcePixels[index + 1] === 212 && wcePixels[index + 2] === 131) {
            intactWcePixels += 1;
          }
        }
        let intactBcxPixels = 0;
        for (let index = 0; index < bcxPixels.length; index += 4) {
          if (bcxPixels[index] === 139 && bcxPixels[index + 1] === 108 && bcxPixels[index + 2] === 255) {
            intactBcxPixels += 1;
          }
        }
        const patching = runtimePageRealm.bcModSdk.getPatchingInfo();
        const statusHooks = patching.get("ChatRoomDrawCharacterStatusIcons")?.hookedByMods ?? [];
        const outerHooks = patching.get("ChatRoomCharacterViewDrawOverlay")?.hookedByMods ?? [];
        const result = {
          publicApi: runtimePageRealm.KikiLink?.getVersion?.() || null,
          versionBadge: version?.textContent || null,
          pageRuntimeInjected: document.documentElement.dataset.kikilinkPageRealm === runtimePageRealm.KikiLink?.getVersion?.(),
          unsafeWindowUntouched: unsafeWindowReads === 0,
          blossomNativeDraw: window.__KIKILINK_NATIVE_DRAWS__.length > 0,
          blossomVisiblePixels: opaqueFlowerPixels > 25,
          echoSlotPreserved: intactEchoPixels > 1_000,
          wceSlotPreserved: intactWcePixels > 1_500,
          bcxSlotPreserved: intactBcxPixels > 700,
          oneKikiStatusHook: statusHooks.filter((name) => name === "KikiLink").length === 1,
          noKikiOuterHook: !outerHooks.includes("KikiLink"),
          blossomDomHidden: !!blossom && blossom.hidden && blossom.style.display === "none",
          customActivityInRegistry: runtimePageRealm.ActivityFemale3DCG.some((activity) => activity.Name.startsWith("KikiLinkCustom_")),
          customActivityInDialog: !!custom,
          customActivityButton: !!document.querySelector("#activity-grid [data-activity^='KikiLinkCustom_']"),
          customActivityMark: activityMark?.style.width === "12px" && activityMark?.style.left === "0px",
        };
        window.__KIKILINK_HARNESS_RESULT__ = result;
        const passed = Object.values(result).every(Boolean);
        document.getElementById("harness-status").textContent = `${passed ? "PASS" : "FAIL"} ${JSON.stringify(result)}`;
        document.body.dataset.harnessPassed = String(passed);
      }, 1400);
    </script>
  </body>
</html>
